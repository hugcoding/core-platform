<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CORE Werkset</title><link rel="stylesheet" href="/coredashboard/assets/style.css"><link rel="stylesheet" href="/coredashboard/assets/workset.css"></head>
<body class="workset-page"><div class="glow"></div><main>
  <header><div><p class="eyebrow">CORE PERSONAL WORKSPACE</p><h1>Werkset <span>actieve documenten</span></h1></div><a class="back-link" href="/coredashboard">← Pulse</a></header>
  <section class="hero panel workset-hero"><div class="orb"><i></i></div><div><p class="eyebrow">VIRTUELE WERKMAP</p><h2>Vandaag relevant</h2><p>CORE toont actieve golden records. De fysieke opslag wordt nog niet gewijzigd.</p></div><div class="hero-meta"><span>READ ONLY</span><strong id="worksetUpdated">—</strong></div></section>
  <section id="worksetStats" class="workset-stats"></section>
  <section class="panel workset-controls" aria-label="Werksetfilters"><label>Zoeken<input id="worksetSearch" type="search" placeholder="Bestandsnaam of map"></label><label>Status<select id="worksetStatus"><option value="active">Actief</option><option value="needs_review">Beoordelen</option><option value="inactive">Inactief</option><option value="all">Alles</option></select></label><label>Type<select id="worksetExtension"><option value="all">PDF, Word en Excel</option><option value="pdf">PDF</option><option value="docx">Word</option><option value="xlsx">Excel</option></select></label></section>
  <div class="section-title workset-heading"><h3>Documenten</h3><span id="worksetCount">laden…</span></div><section id="worksetDocuments" class="document-list" aria-live="polite"></section><button id="worksetMore" class="more-button" type="button" hidden>Meer laden</button>
  <footer>CORE Werkset MVP · virtueel en read-only · geen bestanden verplaatst</footer>
</main><script src="/coredashboard/assets/workset.js"></script></body></html>
