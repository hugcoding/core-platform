services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: core, POSTGRES_PASSWORD: synthetic, POSTGRES_DB: core_finance_test}
    tmpfs: [/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U core -d core_finance_test"], interval: 2s, timeout: 2s, retries: 30}
    mem_limit: 384m
    cpu_shares: 128
  integration:
    build: {context: ../../.., dockerfile: tests/integration/finance/Dockerfile}
    depends_on: {postgres: {condition: service_healthy}}
    environment: {DB_HOST: postgres, DB_PORT: 5432, DB_USER: core, DB_PASS: synthetic, DB_NAME: core_finance_test}
    command: [python, -m, unittest, tests.test_finance, -v]
    mem_limit: 384m
    cpu_shares: 128
