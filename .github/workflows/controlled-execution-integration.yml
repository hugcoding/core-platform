name: controlled-execution-integration

on:
  pull_request:
    paths:
      - "controlled_execution_worker.py"
      - "core/migration/**"
      - "core/cleanup/**"
      - "dashboard/**"
      - "database/migrations/**controlled_execution**"
      - "tests/integration/controlled-execution/**"
      - "Dockerfile.controlled-execution-worker"
      - "docker-compose.yml"
  workflow_dispatch:

jobs:
  postgres-filesystem-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and execute integration roundtrip
        run: docker compose -f tests/integration/controlled-execution/compose.yml up --build --abort-on-container-exit --exit-code-from integration
      - name: Preserve integration logs
        if: always()
        run: docker compose -f tests/integration/controlled-execution/compose.yml logs --no-color
      - name: Remove integration environment
        if: always()
        run: docker compose -f tests/integration/controlled-execution/compose.yml down -v
