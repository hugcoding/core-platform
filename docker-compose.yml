name: nas
services:
  dashboard:
    build: { context: ., dockerfile: Dockerfile.dashboard }
    restart: unless-stopped
    depends_on: { redis: { condition: service_healthy } }
    ports: ["192.168.68.105:8080:8080"]
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - EXPORT_DIR=/exports/migration-inventory
      - HOST_PROC=/host/proc
      - STORAGE_PATH=/volume1
      - CORE_REVIEW_WRITES_ENABLED=${CORE_REVIEW_WRITES_ENABLED:-false}
      - CORE_REVIEWER=${CORE_REVIEWER:-hugo}
      - CORE_LLM_ENABLED=${CORE_LLM_ENABLED:-false}
      - CORE_LLM_ENDPOINT=${CORE_LLM_ENDPOINT:-http://192.168.68.107:11434/v1}
      - CORE_LLM_MODEL=${CORE_LLM_MODEL:-qwen3.6:latest}
      - CORE_LLM_TIMEOUT_SECONDS=${CORE_LLM_TIMEOUT_SECONDS:-600}
    volumes:
      - "./project/exports:/exports:ro"
      - "/proc:/host/proc:ro"
      - "/volume1:/volume1:ro"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]

  workset_ai_worker:
    build: { context: ., dockerfile: Dockerfile.workset-ai-worker }
    restart: unless-stopped
    depends_on: { redis: { condition: service_healthy } }
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - CORE_LLM_ENDPOINT=${CORE_LLM_ENDPOINT:-http://192.168.68.107:11434/v1}
      - CORE_LLM_MODEL=${CORE_LLM_MODEL:-qwen3.6:latest}
      - CORE_LLM_TIMEOUT_SECONDS=${CORE_LLM_TIMEOUT_SECONDS:-600}
      - CORE_AI_MAX_CPU_PERCENT=${CORE_AI_MAX_CPU_PERCENT:-70}
      - CORE_AI_MIN_AVAILABLE_MIB=${CORE_AI_MIN_AVAILABLE_MIB:-3072}
      - CORE_AI_MAX_STREAM_LAG=${CORE_AI_MAX_STREAM_LAG:-1000}
      - CORE_AI_POLL_SECONDS=${CORE_AI_POLL_SECONDS:-10}
    volumes:
      - "/proc:/host/proc:ro"
      - "/volume1:/volume1:ro"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]

  controlled_execution_worker:
    build: { context: ., dockerfile: Dockerfile.controlled-execution-worker }
    restart: unless-stopped
    depends_on: { redis: { condition: service_healthy } }
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - CORE_EXECUTION_MIN_AVAILABLE_MIB=${CORE_EXECUTION_MIN_AVAILABLE_MIB:-1024}
      - CORE_EXECUTION_MAX_LOAD_PER_CPU=${CORE_EXECUTION_MAX_LOAD_PER_CPU:-1.5}
      - CORE_EXECUTION_MAX_STREAM_LAG=${CORE_EXECUTION_MAX_STREAM_LAG:-1000}
      - CORE_EXECUTION_POLL_SECONDS=${CORE_EXECUTION_POLL_SECONDS:-5}
    volumes:
      - "/proc:/host/proc:ro"
      - "/volume1/data:/volume1/data"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]

  workset_ocr_worker:
    build: { context: ., dockerfile: Dockerfile.workset-ocr-worker }
    restart: unless-stopped
    depends_on: { redis: { condition: service_healthy } }
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - CORE_OCR_LANGUAGES=${CORE_OCR_LANGUAGES:-nld+eng}
      - CORE_OCR_MAX_CPU_PERCENT=${CORE_OCR_MAX_CPU_PERCENT:-60}
      - CORE_OCR_MIN_AVAILABLE_MIB=${CORE_OCR_MIN_AVAILABLE_MIB:-2048}
      - CORE_OCR_MAX_STREAM_LAG=${CORE_OCR_MAX_STREAM_LAG:-1000}
      - CORE_OCR_MAX_PAGES=${CORE_OCR_MAX_PAGES:-100}
      - CORE_OCR_POLL_SECONDS=${CORE_OCR_POLL_SECONDS:-10}
    volumes:
      - "/proc:/host/proc:ro"
      - "/volume1:/volume1:ro"
      - "/volume1/docker/core-runtime/ocr:/volume1/docker/core-runtime/ocr"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]

  classifier:
    profiles: ["tools"]
    build: { context: ., dockerfile: Dockerfile.classifier }
    volumes:
      - "/volume1:/volume1:ro"
      - "./project/exports:/app/project/exports"
    security_opt: ["no-new-privileges:true"]

  docs:
    build: { context: ., dockerfile: Dockerfile.docs }
    restart: unless-stopped
    ports: ["192.168.68.105:8000:80"]
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis_data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 3 }

  scanner:
    build: { context: ., dockerfile: Dockerfile.scanner }
    restart: unless-stopped
    depends_on: { redis: { condition: service_healthy } }
    volumes: ["/volume1:/volume1:ro"]
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - SCAN_ROOT=${SCAN_ROOT:-/volume1}
      - SCAN_ROOTS=${SCAN_ROOTS:-/volume1/backup/NITRO/D/data/hugo/Documents,/volume1/data}
      - SCAN_INTERVAL=${SCAN_INTERVAL:-600}
      - FULL_SCAN_INTERVAL=${FULL_SCAN_INTERVAL:-3600}
      - MISSING_SCAN_THRESHOLD=${MISSING_SCAN_THRESHOLD:-2}

  watcher:
    build: { context: ., dockerfile: Dockerfile.watcher }
    restart: unless-stopped
    depends_on: { redis: { condition: service_healthy } }
    volumes: ["/volume1:/volume1:ro"]
    environment:
      - REDIS_HOST=redis
      - SCAN_ROOT=${SCAN_ROOT:-/volume1}
      - WATCH_ROOTS=${WATCH_ROOTS:-/volume1/data}
      - STREAM_KEY=${REALTIME_STREAM_KEY:-scan_stream_realtime}
      - WATCHER_DEBOUNCE_SECONDS=${WATCHER_DEBOUNCE_SECONDS:-2}
    healthcheck:
      test: ["CMD", "python3", "-c", "import redis; r=redis.Redis(host='redis', decode_responses=True); assert r.get('watcher:heartbeat')"]
      interval: 30s
      timeout: 5s
      retries: 3

  metadata_worker:
    build: { context: ., dockerfile: Dockerfile.metadata }
    restart: unless-stopped
    depends_on: { redis: { condition: service_healthy } }
    volumes: ["/volume1:/volume1:ro"]
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - REALTIME_STREAM_KEY=${REALTIME_STREAM_KEY:-scan_stream_realtime}
      - FORCE_FULL_METADATA=${FORCE_FULL_METADATA:-false}

    healthcheck:
      test: ["CMD", "python3", "-c", "import redis; r=redis.Redis(host='redis', decode_responses=True); r.ping()"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
